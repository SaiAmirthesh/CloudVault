spring.application.name=Backend

spring.datasource.url=jdbc:postgresql://localhost:5433/cloudvault
spring.jpa.open-in-view=false
minio.endpoint=http://localhost:9000
minio.bucket-name=cloudvault-files
spring.config.import=optional:classpath:application-local.properties

# ── CORS ─────────────────────────────────────────────────────────────────────
# Comma-separated list of allowed origins for CORS.
# In production, set this to the actual frontend domain (e.g. https://app.cloudvault.io)
app.cors.allowed-origins=http://localhost:5173

# ── Cookie Settings ───────────────────────────────────────────────────────────
# app.cookie.secure: Set to true in production (HTTPS required).
#                    Overridden to false in application-local.properties for local HTTP dev.
app.cookie.secure=true
# SameSite=Strict: The cookie is NEVER sent on cross-site requests → CSRF-proof
app.cookie.same-site=Strict
# Max age in seconds — should match JWT expiry (default 3600 = 1 hour)
app.cookie.max-age-seconds=3600